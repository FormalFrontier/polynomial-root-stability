version: "v0.4"

project:
  name: Polynomial Root Stability
  description: >-
    Fixed-degree stability of polynomial root-generated intermediate fields
    inside a common Krasner normed extension, including monic, normalized,
    and ordinary-coefficient versions with derived nearby separability, plus
    quantitative Newton lifting with convergence and resultant-controlled
    factorization over complete ultrametric normed fields, together with
    polynomial estimates for valuations in linearly ordered commutative
    value monoids with zero.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: Fixed-ambient-field root-generated-field stability
    type: original-proof
    relationship: other
    note: >-
      The fixed-IsKrasner formulation and its proof are original work of
      Formal Frontier Agents; no novelty for Krasner's lemma or the motivating
      source theorem is asserted.
  - title: Cohomology of Number Fields, corrected second edition 2.3
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    id: "ISBN 978-3-540-37888-0"
    type: book
    location: "Section 12.1.1; corrected edition 2.3, May 2020"
    relationship: background
    note: >-
      Mathematical motivation for fixed-degree root-field stability. The
      formulation here fixes a common normed ambient extension and assumes
      splitting; no claim that section 12.1.1 is fully formalized is made.

  - title: Local Fields and Their Extensions, second edition
    authors:
      - Ivan B. Fesenko
      - Sergei V. Vostokov
    type: book
    location: "Chapter II, Section 1, Proposition 1.1 (p. 36), Corollary 3 (p. 37), Exercise 1 (p. 38)"
    relationship: background
    note: >-
      Motivation for quantitative Newton lifting, convergence and
      resultant-controlled factorization. The normed-field formulations allow
      arbitrary complete ultrametric normed fields and make zero/constant degree
      conventions explicit; no complete source-formalization claim is made.

status:
  scope: >-
    Nonzero separable reference and same-degree splitting comparison
    polynomials in one IsKrasner normed extension; real/complex variants,
    varying degrees and canonical splitting-field objects excluded. Also a
    quantitative Newton lifting theorem for integral polynomials
    over complete ultrametric normed fields, and resultant-controlled
    two-factor lifting with degree and leading-coefficient preservation and
    quantitative correction bounds. Generic value-monoid estimates give
    anchored and two-point polynomial scaling and derivative-value constancy
    over commutative rings, with injectivity only for valuations of zero support;
    no arbitrary-rank root-existence theorem is asserted. Newton lifting
    retains its complete ultrametric normed-field hypotheses.
