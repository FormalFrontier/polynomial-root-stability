fidelity:
  divergences: >-
    Fixed Krasner normed extension with explicit splitting hypotheses,
    same natDegree and equality of root-generated intermediate fields;
    no equivalence of canonical splitting-field objects and no
    real/complex-variant source correspondence claim. The resultant theorem
    replaces a complete nontrivial discrete valuation by a complete ultrametric
    field norm, expresses integrality through coefficient bounds, and uses a
    strict WithBot error-degree bound for the degree and exact-leading-coefficient
    constraint. It preserves both leading coefficients and includes zero and
    constant degree conventions left implicit in the source. The value-monoid
    estimates require only positive-index coefficient bounds and a unit-ball
    anchor; the constant coefficient is unrestricted. Their value identities
    do not require separation, and injectivity separately assumes zero support.

review:
  status: pending

acknowledgements: >-
  Reuses pinned mathlib's Krasner and continuity-of-roots infrastructure;
  source material is not bundled. Newton iteration reuses Mathlib's newtonMap;
  quantitative lifting also uses its Banach fixed point and ultrametric norm APIs
  and is inspired by its p-adic hensels_lemma. Factor lifting reuses its Sylvester
  map, adjugate, finite coefficient representations and polynomial sup norm.
  Generic value-monoid estimates reuse Mathlib's valuation and finite-sum bounds,
  polynomial Taylor, Hasse derivative and divX interfaces, and geometric-sum API;
  their formalization is authored collectively by Formal Frontier Agents.
