version: "v0.4"

project:
  name: Polynomial Root Stability
  description: >-
    Fixed-degree stability of polynomial root-generated intermediate fields
    inside a common Krasner normed extension, including monic, normalized,
    and ordinary-coefficient versions with derived nearby separability, plus
    quantitative Newton lifting and convergence with ultrametric estimates.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0

sources:
  - title: Fixed-ambient-field root-generated-field stability
    type: original-proof
    relationship: other
    note: >-
      The fixed-IsKrasner formulation and its proof are original work of
      Formal Frontier Agents; no novelty for Krasner's lemma or the motivating
      source theorem is asserted.
  - title: Cohomology of Number Fields, corrected second edition 2.3
    authors:
      - Jürgen Neukirch
      - Alexander Schmidt
      - Kay Wingberg
    id: "ISBN 978-3-540-37888-0"
    type: book
    location: "Section 12.1.1; corrected edition 2.3, May 2020"
    relationship: background
    note: >-
      Mathematical motivation, not an accepted statement-by-statement
      correspondence or a claim that section 12.1.1 is fully formalized.

  - title: Local Fields and Their Extensions, second edition
    authors:
      - Ivan B. Fesenko
      - Sergei V. Vostokov
    type: book
    location: "Chapter II, Section 1, Corollary 3 (p. 37) and Exercise 1 (p. 38)"
    relationship: background
    note: >-
      Motivation for quantitative Newton lifting and convergence; no completed
      source correspondence is asserted.

status:
  scope: >-
    Nonzero separable reference and same-degree splitting comparison
    polynomials in one IsKrasner normed extension; real/complex variants,
    varying degrees and canonical splitting-field objects excluded. Also a
    quantitative Newton lifting theorem for integral polynomials
    over complete ultrametric normed fields; no higher-rank valuation claim.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: IsKrasner.exists_pos_adjoin_rootSet_eq_of_monic_separable
      file: PolynomialRootStability/Krasner.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: IsKrasner.exists_pos_adjoin_rootSet_eq_of_separable_normalized
      file: PolynomialRootStability/Normalization.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
    - declaration: IsKrasner.exists_pos_adjoin_rootSet_eq_of_separable
      file: PolynomialRootStability/Normalization.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

    - declaration: Polynomial.exists_root_tendsto_iterate_newtonMap
      file: PolynomialRootStability/Newton.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]

automation:
  methods:
    - method: agent
      framework: Codex CLI and Hive Tasks
      tool_setup: >-
        AI-assisted Lean proof development, module organization, examples
        and documentation, with pinned Lean and mathlib compilation and
        independent mathematical and API review.
  notes: >-
    Automated assistance is not a substitute for proof-term validation,
    mathematical review or source-correspondence review.

fidelity:
  divergences: >-
    Fixed Krasner normed extension with explicit splitting hypotheses,
    same natDegree and equality of root-generated intermediate fields;
    no equivalence of canonical splitting-field objects and no
    real/complex-variant source correspondence claim.

review:
  status: pending
  notes: >-
    The current contribution awaits independent mathematical and API review.
    The metadata and historical API snapshot do not certify review or complete
    source correspondence.

acknowledgements: >-
  Reuses pinned mathlib's Krasner and continuity-of-roots infrastructure;
  source material is not bundled. Newton iteration reuses Mathlib's newtonMap;
  quantitative lifting also uses its Banach fixed point and ultrametric norm APIs
  and is inspired by its p-adic hensels_lemma.
