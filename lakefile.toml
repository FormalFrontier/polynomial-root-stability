name = "polynomial-root-stability"
version = "0.1.0"
defaultTargets = ["PolynomialRootStability", "PolynomialRootStabilityTest"]
lintDriver = "batteries/runLinter"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[lean_lib]]
name = "PolynomialRootStability"

[[lean_lib]]
name = "PolynomialRootStabilityTest"
roots = ["PolynomialRootStabilityTest.Krasner", "PolynomialRootStabilityTest.Normalization",
  "PolynomialRootStabilityTest.Newton", "PolynomialRootStabilityTest.NewtonContracts",
  "PolynomialRootStabilityTest.PadicHensel", "PolynomialRootStabilityTest.ResultantFactorization",
  "PolynomialRootStabilityTest.NewtonNaturality",
  "PolynomialRootStabilityTest.CoefficientPerturbation"]

[lean_lib.leanOptions]
weak.linter.privateModule = false
